<section class="session-participant-shell">
  @if (loadError()) {
    <p class="session-participant-shell__error" role="alert">
      {{ 'session.participantShell.loadError' | transloco }}
    </p>
  } @else if (session(); as s) {
    <div class="session-participant-shell__activity">
      @if (activityComponent(); as component) {
        <ng-container
          *ngComponentOutlet="component; inputs: activityInputs() ?? {}"
        ></ng-container>
      }

      @if (s.status === 'PAUSED') {
        <app-session-paused-overlay></app-session-paused-overlay>
      }
    </div>
  } @else {
    <div class="session-participant-shell__skeleton" aria-busy="true" aria-live="polite">
      <span class="__sr-only">{{ 'session.participantShell.loading' | transloco }}</span>
      <div class="pv-skeleton session-participant-shell__skeleton-line session-participant-shell__skeleton-line--title"></div>
      <div class="pv-skeleton session-participant-shell__skeleton-line session-participant-shell__skeleton-line--body"></div>
      <div class="pv-skeleton session-participant-shell__skeleton-line session-participant-shell__skeleton-line--body"></div>
    </div>
  }
</section>
